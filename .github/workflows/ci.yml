name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Test
        run: cargo test --locked -p decompiler

      - name: Build CLI
        run: cargo build --locked --release -p cli

      - name: Build wasm
        run: cargo build --locked --release -p installscript-decompiler-web --target wasm32-unknown-unknown
